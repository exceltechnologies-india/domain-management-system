name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Skip Puppeteer's Chromium download — CI runs unit + lint, not browser tests.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  ci:
    name: Lint + Test + Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (errors only — warnings tracked separately to avoid GitHub annotation spam)
        run: npx next lint --quiet

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    # Gating step — fails the workflow on any high-or-critical advisory.
    # The previous Next.js advisories were cleared by the 2026-05-17 bump
    # to next@15.5.18 and this job now runs clean. If a new advisory
    # lands, either bump the affected package or add a per-vuln
    # suppression — do not blanket-disable.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity threshold)
        run: npm audit --audit-level=high
