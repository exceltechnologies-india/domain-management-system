name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Skip Puppeteer's Chromium download — CI runs unit + lint, not browser tests.
  PUPPETEER_SKIP_DOWNLOAD: "true"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

jobs:
  ci:
    name: Lint + Test + Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

  audit:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    # Informational only — does NOT block the merge while the open Next.js
    # advisories are being assessed. Promote to required once npm audit
    # returns clean (or once a per-vuln allowlist is configured).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high severity threshold)
        run: npm audit --audit-level=high
